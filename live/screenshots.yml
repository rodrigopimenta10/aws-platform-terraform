# Console pages to capture during a live drill, one list per stack in live/stacks/.
# Read by live/console-shots.mjs on the GitHub runner (headless Chromium signed in as the drill role),
# and by live/summary.sh for the job summary's console links. scripts/check.sh fails unless the top-level
# keys here match live/stacks/*.
#
# Each entry:
#   name    file name of the screenshot (docs/live/<date>-<stack>/<name>.png)
#   url     console URL. {region} and {<output>} are filled from the stack's string outputs
#           (`terraform output -json`). Resource IDs are fine in URLs; account IDs never are.
#   steps   optional, run in order after the page loads:
#             - tab: "<tab name>"        click a tab
#             - search: "<text>"         type into the page's search or filter box, then Enter
#             - click: "<visible text>"  click the first element showing that text
#             - wait_for: "<text>"       wait until that text appears
#   proves  one line: what the screenshot must show (becomes its caption in the drill report)
vpc:
  - name: vpc-details
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#VpcDetails:VpcId={vpc_id}"
    steps:
      - wait_for: "platform-live-vpc"
    proves: "VPC platform-live-vpc, 10.0.0.0/16, DNS resolution and DNS hostnames enabled"
  - name: resource-map
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#VpcDetails:VpcId={vpc_id}"
    steps:
      - tab: "Resource map"
    proves: "2 AZs x 3 tiers = 6 subnets, the stack's route tables, 1 internet gateway, no NAT gateway"
  - name: subnets
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#subnets:search=platform-live-vpc"
    steps:
      - wait_for: "platform-live-vpc-private"
    proves: "6 subnets named platform-live-vpc-<tier>-<az> (ADR 0002): private /20s, public and isolated /22s"
  - name: public-route-table
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#RouteTableDetails:RouteTableId={public_route_table_id}"
    steps:
      - tab: "Routes"
    proves: "0.0.0.0/0 goes to the internet gateway; associated with both public subnets"
  - name: isolated-route-table
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#RouteTableDetails:RouteTableId={isolated_route_table_id}"
    steps:
      - tab: "Routes"
    proves: "Only the local route: isolated subnets have no way out of the VPC"
  - name: tags
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#VpcDetails:VpcId={vpc_id}"
    steps:
      - tab: "Tags"
    proves: "Standard tags from ADR 0002 (project, environment=live, owner, managed-by) plus live-stack=vpc"
m1:
  - name: endpoints
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#Endpoints:search=platform-live"
    steps:
      - wait_for: "platform-live-sts-vpce"
    proves: "5 endpoints: the S3 gateway endpoint plus ECR api, ECR dkr, STS and Logs interface endpoints, all named platform-live-<service>-vpce"
  - name: sts-endpoint-details
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#EndpointDetails:vpcEndpointId={sts_endpoint_id}"
    steps:
      - wait_for: "platform-live-sts-vpce"
    proves: "STS interface endpoint with private DNS names enabled, in the drill VPC"
  - name: sts-endpoint-subnets
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#EndpointDetails:vpcEndpointId={sts_endpoint_id}"
    steps:
      - tab: "Subnets"
    proves: "The endpoint has a network interface in each of the 2 private subnets"
  - name: sts-endpoint-security-group
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#SecurityGroup:securityGroupId={sts_security_group_id}"
    steps:
      - tab: "Inbound rules"
    proves: "The endpoint's own security group allows only HTTPS (443) from 10.0.0.0/16"
  - name: s3-gateway-endpoint-routes
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#EndpointDetails:vpcEndpointId={s3_gateway_endpoint_id}"
    steps:
      - tab: "Route tables"
    proves: "The S3 gateway endpoint is attached to both private route tables and the isolated one"
