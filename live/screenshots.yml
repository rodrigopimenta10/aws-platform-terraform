# Console pages to capture during a live drill, one list per stack in live/stacks/.
# Read by live/console-shots.mjs on the GitHub runner (headless Chromium signed in as the drill role),
# and by live/summary.sh for the job summary's console links. scripts/check.sh fails unless the top-level
# keys here match live/stacks/*.
#
# Each entry:
#   name    file name of the screenshot (docs/live/<date>-<stack>/<name>.png)
#   url     console URL. {region} and {<output>} are filled from the stack's string outputs
#           (`terraform output -json`). Resource IDs are fine in URLs; account IDs never are.
#   steps   optional, run in order after the page loads:
#             - tab: "<tab name>"        click a tab
#             - search: "<text>"         type into the page's search or filter box, then Enter
#             - click: "<visible text>"  click the first element showing that text
#             - wait_for: "<text>"       wait until that text appears
#   proves  one line: what the screenshot must show (becomes its caption in the drill report)
vpc:
  - name: vpc-details
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#VpcDetails:VpcId={vpc_id}"
    steps:
      - wait_for: "platform-live-vpc"
    proves: "VPC platform-live-vpc, 10.0.0.0/16, DNS resolution and DNS hostnames enabled"
  - name: resource-map
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#VpcDetails:VpcId={vpc_id}"
    steps:
      - tab: "Resource map"
    proves: "2 AZs x 3 tiers = 6 subnets, the stack's route tables, 1 internet gateway, no NAT gateway"
  - name: subnets
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#subnets:search=platform-live-vpc"
    steps:
      - wait_for: "platform-live-vpc-private"
    proves: "6 subnets named platform-live-vpc-<tier>-<az> (ADR 0002): private /20s, public and isolated /22s"
  - name: public-route-table
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#RouteTableDetails:RouteTableId={public_route_table_id}"
    steps:
      - tab: "Routes"
    proves: "0.0.0.0/0 goes to the internet gateway; associated with both public subnets"
  - name: isolated-route-table
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#RouteTableDetails:RouteTableId={isolated_route_table_id}"
    steps:
      - tab: "Routes"
    proves: "Only the local route: isolated subnets have no way out of the VPC"
  - name: tags
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#VpcDetails:VpcId={vpc_id}"
    steps:
      - tab: "Tags"
    proves: "Standard tags from ADR 0002 (project, environment=live, owner, managed-by) plus live-stack=vpc"
m1:
  - name: endpoints
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#Endpoints:search=platform-live"
    steps:
      - wait_for: "platform-live-sts-vpce"
    proves: "5 endpoints: the S3 gateway endpoint plus ECR api, ECR dkr, STS and Logs interface endpoints, all named platform-live-<service>-vpce"
  - name: sts-endpoint-details
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#EndpointDetails:vpcEndpointId={sts_endpoint_id}"
    steps:
      - wait_for: "platform-live-sts-vpce"
    proves: "STS interface endpoint with private DNS names enabled, in the drill VPC"
  - name: sts-endpoint-subnets
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#EndpointDetails:vpcEndpointId={sts_endpoint_id}"
    steps:
      - tab: "Subnets"
    proves: "The endpoint has a network interface in each of the 2 private subnets"
  - name: sts-endpoint-security-group
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#SecurityGroup:securityGroupId={sts_security_group_id}"
    steps:
      - tab: "Inbound rules"
    proves: "The endpoint's own security group allows only HTTPS (443) from 10.0.0.0/16"
  - name: s3-gateway-endpoint-routes
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#EndpointDetails:vpcEndpointId={s3_gateway_endpoint_id}"
    steps:
      - tab: "Route tables"
    proves: "The S3 gateway endpoint is attached to both private route tables and the isolated one"
  - name: vpc-flow-logs
    url: "https://{region}.console.aws.amazon.com/vpcconsole/home?region={region}#VpcDetails:VpcId={vpc_id}"
    steps:
      - tab: "Flow logs"
    proves: "A flow log on the VPC: filter ALL, destination type CloudWatch Logs, destination the platform-live-flow-logs log group, status Active"
  - name: flow-log-group
    url: "https://{region}.console.aws.amazon.com/cloudwatch/home?region={region}#logsV2:log-groups$3FlogGroupNameFilter$3Dplatform-live-flow-logs"
    steps:
      - wait_for: "platform-live-flow-logs"
    proves: "The log group /aws/vpc/flow-logs/platform-live-flow-logs with 1 year retention and a KMS key ID shown"
m2:
  - name: kms-key
    url: "https://{region}.console.aws.amazon.com/kms/home?region={region}#/kms/keys/{kms_key_id}"
    steps:
      - wait_for: "platform-live-logs"
    proves: "Customer-managed symmetric key with alias platform-live-logs, enabled, with automatic rotation shown as enabled"
  - name: kms-key-policy
    url: "https://{region}.console.aws.amazon.com/kms/home?region={region}#/kms/keys/{kms_key_id}"
    steps:
      - wait_for: "platform-live-logs"
      - tab: "Key policy"
    proves: "The key policy has the account root delegation statement and a CloudWatch Logs statement limited by an encryption context"
  - name: log-group-uses-key
    url: "https://{region}.console.aws.amazon.com/cloudwatch/home?region={region}#logsV2:log-groups$3FlogGroupNameFilter$3Dplatform-live"
    steps:
      - wait_for: "/aws/platform-live/app"
    proves: "The log group /aws/platform-live/app with 1 year retention and the drill KMS key ID shown"
  - name: github-role-trust
    url: "https://{region}.console.aws.amazon.com/iam/home?region={region}#/roles/details/{github_role_name}?section=trust_relationships"
    steps:
      - wait_for: "platform-live-github-deploy"
    proves: "Role platform-live-github-deploy trusts the GitHub OIDC provider with audience sts.amazonaws.com and only this repository's refs/heads/main as subject"
  - name: worker-role-boundary
    url: "https://{region}.console.aws.amazon.com/iam/home?region={region}#/roles/details/{worker_role_name}?section=permissions"
    steps:
      - wait_for: "platform-live-worker"
    proves: "Role platform-live-worker has no permission policies and shows the permissions boundary platform-live-drill-boundary"
  - name: ebs-default-encryption
    url: "https://{region}.console.aws.amazon.com/ec2/home?region={region}#Settings:tab=dataProtectionAndSecurity"
    steps:
      - wait_for: "EBS encryption"
    proves: "EC2 settings, Data protection and security: Always encrypt new EBS volumes is Enabled"
  - name: s3-account-public-access
    url: "https://s3.console.aws.amazon.com/s3/settings?region={region}"
    steps:
      - wait_for: "Block Public Access settings for this account"
    proves: "S3 Block public access (account settings): all four settings On"
  - name: iam-password-policy
    url: "https://{region}.console.aws.amazon.com/iam/home?region={region}#/account_settings"
    steps:
      - wait_for: "Password policy"
    proves: "IAM account settings show the password policy: 14 characters minimum, 90 day expiry, reuse prevention of 24"
m3:
  - name: ecr-repositories
    url: "https://{region}.console.aws.amazon.com/ecr/private-registry/repositories?region={region}"
    steps:
      - wait_for: "platform-live-api"
    proves: "Private repositories platform-live-api and platform-live-worker, both with Immutable tag mutability and KMS encryption"
  - name: ecr-key
    url: "https://{region}.console.aws.amazon.com/kms/home?region={region}#/kms/keys/{kms_key_id}"
    steps:
      - wait_for: "platform-live-ecr"
    proves: "The customer-managed key alias platform-live-ecr that encrypts both repositories, enabled, with automatic rotation shown as enabled"
  - name: eks-cluster
    url: "https://{region}.console.aws.amazon.com/eks/clusters/{eks_cluster_name}?region={region}"
    steps:
      - wait_for: "platform-live-eks"
    proves: "Cluster platform-live-eks is Active, runs the pinned Kubernetes version, and shows secrets encryption enabled with the customer-managed key"
  - name: eks-networking
    url: "https://{region}.console.aws.amazon.com/eks/clusters/{eks_cluster_name}?region={region}"
    steps:
      - wait_for: "platform-live-eks"
      - click: "Networking"
    proves: "API server endpoint access is Private, in the stack's two private subnets, with the cluster security group"
  - name: eks-key
    url: "https://{region}.console.aws.amazon.com/kms/home?region={region}#/kms/keys/{eks_kms_key_id}"
    steps:
      - wait_for: "platform-live-eks"
    proves: "The customer-managed key alias platform-live-eks, enabled, with automatic rotation shown as enabled"
  - name: eks-compute
    url: "https://{region}.console.aws.amazon.com/eks/clusters/{eks_cluster_name}?region={region}"
    steps:
      - wait_for: "platform-live-eks"
      - click: "Compute"
      - wait_for: "platform-live-nodes-system"
    proves: "Node groups platform-live-nodes-system (On-Demand) and platform-live-nodes-batch (Spot), the first Active with one node"
  - name: eks-node-group
    url: "https://{region}.console.aws.amazon.com/eks/clusters/{eks_cluster_name}/nodegroups/{eks_system_node_group_name}?region={region}"
    steps:
      - wait_for: "platform-live-nodes-system"
    proves: "Node group platform-live-nodes-system is Active on t3.small with scaling 1 to 2, the workload=system label and the node-group launch template"
  - name: eks-addons
    url: "https://{region}.console.aws.amazon.com/eks/clusters/{eks_cluster_name}?region={region}"
    steps:
      - wait_for: "platform-live-eks"
      - click: "Add-ons"
      - wait_for: "aws-ebs-csi-driver"
    proves: "Add-ons vpc-cni, coredns, kube-proxy, eks-pod-identity-agent and aws-ebs-csi-driver are installed, Active and on the versions the stack pinned"
  - name: eks-pod-identity
    url: "https://{region}.console.aws.amazon.com/eks/clusters/{eks_cluster_name}?region={region}"
    steps:
      - wait_for: "platform-live-eks"
      - click: "Access"
      - click: "Pod Identity associations"
      - wait_for: "orders-api"
    proves: "A Pod Identity association links service account orders-api in namespace orders to the role platform-live-orders"
  - name: eks-controller-policies
    url: "https://{region}.console.aws.amazon.com/iam/home?region={region}#/policies"
    steps:
      - search: "platform-live-"
      - wait_for: "platform-live-karpenter"
    proves: "Customer-managed policies platform-live-lb-controller and platform-live-karpenter exist next to the boundary policy"
